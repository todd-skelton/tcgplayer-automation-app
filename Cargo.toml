[package]
name = "tcgplayer-automation"
version = "0.1.0"
edition = "2024"
publish = false
description = "TCGPlayer Automation on Corten: screens ported one at a time from the React Router app in app/, which serves the rest through the legacy relay."

[dependencies]
# Pinned to one revision of main; bump it on purpose when a fix the port needs lands.
corten = { git = "https://github.com/todd-skelton/corten", rev = "b113087b", features = ["json", "compress", "types"] }
corten-ui = { git = "https://github.com/todd-skelton/corten", rev = "b113087b" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# The visitor's time zone, from the name the browser gives (`App::client_zone`).
chrono-tz = "0.10"
# The legacy relay to the Node app, and the slab data providers (rustls for their HTTPS). No
# gzip/brotli features: an encoded answer goes on as it came.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "multipart"] }
futures-util = { version = "0.3", default-features = false }
csv = "1"
dotenvy = "0.15"
regex = "1.13.1"
# Evidence fingerprints that match the ones the Node app records (inventory economics ledger).
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
http-body-util = "0.1"
# The slab providers' tests serve a stand-in provider on this machine.
tokio = { version = "1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
