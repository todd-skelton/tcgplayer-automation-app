[package]
name = "tcgplayer-automation"
version = "0.1.0"
edition = "2024"
publish = false
description = "TCGPlayer Automation on Corten: screens ported one at a time from the React Router app in app/, which serves the rest through the legacy relay."

[dependencies]
# Pinned to one revision of main; bump it on purpose when a fix the port needs lands.
corten = { git = "https://github.com/todd-skelton/corten", rev = "9167f0a7", features = ["json", "compress", "types"] }
corten-ui = { git = "https://github.com/todd-skelton/corten", rev = "9167f0a7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# The legacy relay to the Node app. No gzip/brotli features: an encoded answer goes on as it came.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false }
csv = "1"
dotenvy = "0.15"
regex = "1.13.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
