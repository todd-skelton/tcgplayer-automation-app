name: tcgplayer-automation-prod

services:
  app:
    image: tcgplayer-automation-app:prod
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.production.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./logs:/app/logs
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
      NODE_ENV: production
      PORT: 3000
      DB_STARTUP_RETRIES: 30
      DB_STARTUP_DELAY_MS: 2000
      WORKERS_RUN_IN_PROCESS: "false"
    restart: unless-stopped
    container_name: tcgplayer-automation-prod
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pricing-worker:
    image: tcgplayer-automation-app:prod
    command: node build/workers/pricing-worker.js
    env_file:
      - path: .env.production.local
        required: false
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
      NODE_ENV: production
      WORKERS_RUN_IN_PROCESS: "false"
    restart: unless-stopped
    container_name: tcgplayer-pricing-worker-prod
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  publication-worker:
    image: tcgplayer-automation-app:prod
    command: node build/workers/publication-worker.js
    env_file:
      - path: .env.production.local
        required: false
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
      NODE_ENV: production
      WORKERS_RUN_IN_PROCESS: "false"
    restart: unless-stopped
    container_name: tcgplayer-publication-worker-prod
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  pricing-scheduler:
    image: tcgplayer-automation-app:prod
    command: node build/workers/continuous-pricing-scheduler.js
    env_file:
      - path: .env.production.local
        required: false
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
      NODE_ENV: production
      WORKERS_RUN_IN_PROCESS: "false"
    restart: unless-stopped
    container_name: tcgplayer-pricing-scheduler-prod
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: tcgplayer-postgres-prod
    environment:
      POSTGRES_DB: tcgplayer_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcgplayer_automation"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
