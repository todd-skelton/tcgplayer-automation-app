name: tcgplayer-automation-prod

# The app runs in one of two slots, blue or green: the Corten app (web-blue or
# web-green), which serves every screen, JSON route and job, and applies the
# migrations when it starts (MIGRATE_ON_START). The proxy owns port 3001 and
# sends traffic to the slot deploy/nginx/active/active.conf names, so a release
# starts the idle slot, waits for its health check, and switches the proxy
# before stopping the old slot. Profiles keep a plain `docker compose up` from
# starting the idle slot.
x-web-environment: &web-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  # Requests arrive from the proxy on the compose network; its X-Forwarded-For names the client.
  PROXIES: 172.16.0.0/12
  SELLER_PORTAL_WRITES_ENABLED: "true"

x-web: &web
  image: tcgplayer-automation-web:prod
  build:
    context: .
    dockerfile: Dockerfile
    target: web
  # Names the app answers to besides localhost and IP addresses (HOSTS=automation.lan) come
  # from here; any other Host gets 421.
  env_file:
    - path: .env.production.local
      required: false
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://127.0.0.1:3000/health/ready",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
    start_interval: 2s

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: tcgplayer-automation-proxy-prod
    ports:
      - "3001:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/active:/etc/nginx/active:ro
    restart: unless-stopped
    healthcheck:
      # nginx listens on IPv4 only, and localhost resolves to ::1 first in this image.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-blue:
    <<: *web
    container_name: tcgplayer-automation-web-prod-blue
    profiles: [blue]
    environment: *web-environment

  web-green:
    <<: *web
    container_name: tcgplayer-automation-web-prod-green
    profiles: [green]
    environment: *web-environment

  postgres:
    image: postgres:16-alpine
    container_name: tcgplayer-postgres-prod
    environment:
      POSTGRES_DB: tcgplayer_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcgplayer_automation"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
