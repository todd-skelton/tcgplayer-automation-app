name: tcgplayer-automation-prod

# The app runs in one of two slots, blue or green. A slot is the Node app
# (app-blue) and the Corten app in front of it (web-blue), which serves the
# screens already ported and relays every other request to its slot's Node app.
# The proxy owns port 3001 and sends traffic to the web container of whichever
# slot deploy/nginx/active/active.conf names, so a release starts the idle
# slot, waits for its health checks, and switches the proxy before stopping the
# old slot. Profiles keep a plain `docker compose up` from starting the idle
# slot.
x-app: &app
  image: tcgplayer-automation-app:prod
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: .env.production.local
      required: false
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - app-logs:/app/logs
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
    NODE_ENV: production
    PORT: 3000
    DB_STARTUP_RETRIES: 30
    DB_STARTUP_DELAY_MS: 2000
    WORKERS_RUN_IN_PROCESS: "false"
  restart: unless-stopped
  # Lets in-flight requests finish after the proxy has moved on.
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://localhost:3000/",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s
    start_interval: 2s

x-web-environment: &web-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  # Requests arrive from the proxy on the compose network; its X-Forwarded-For names the client.
  PROXIES: 172.16.0.0/12

x-web: &web
  image: tcgplayer-automation-web:prod
  build:
    context: .
    dockerfile: Dockerfile
    target: web
  # Names the app answers to besides localhost and IP addresses (HOSTS=automation.lan) come
  # from here; any other Host gets 421.
  env_file:
    - path: .env.production.local
      required: false
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://127.0.0.1:3000/",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
    start_interval: 2s

x-worker: &worker
  image: tcgplayer-automation-app:prod
  env_file:
    - path: .env.production.local
      required: false
  # The release script starts workers after the new app has applied migrations.
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcgplayer_automation
    NODE_ENV: production
    WORKERS_RUN_IN_PROCESS: "false"
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: tcgplayer-automation-proxy-prod
    ports:
      - "3001:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/active:/etc/nginx/active:ro
    restart: unless-stopped
    healthcheck:
      # nginx listens on IPv4 only, and localhost resolves to ::1 first in this image.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app-blue:
    <<: *app
    container_name: tcgplayer-automation-prod-blue
    profiles: [blue]

  app-green:
    <<: *app
    container_name: tcgplayer-automation-prod-green
    profiles: [green]

  web-blue:
    <<: *web
    container_name: tcgplayer-automation-web-prod-blue
    profiles: [blue]
    depends_on:
      app-blue:
        condition: service_healthy
    environment:
      <<: *web-environment
      LEGACY_ORIGIN: http://app-blue:3000

  web-green:
    <<: *web
    container_name: tcgplayer-automation-web-prod-green
    profiles: [green]
    depends_on:
      app-green:
        condition: service_healthy
    environment:
      <<: *web-environment
      LEGACY_ORIGIN: http://app-green:3000

  pricing-worker:
    <<: *worker
    command: node build/workers/pricing-worker.js
    container_name: tcgplayer-pricing-worker-prod

  publication-worker:
    <<: *worker
    command: node build/workers/publication-worker.js
    container_name: tcgplayer-publication-worker-prod

  slab-evidence-worker:
    <<: *worker
    command: node build/workers/slab-evidence-worker.js

  pricing-scheduler:
    <<: *worker
    command: node build/workers/continuous-pricing-scheduler.js
    container_name: tcgplayer-pricing-scheduler-prod

  postgres:
    image: postgres:16-alpine
    container_name: tcgplayer-postgres-prod
    environment:
      POSTGRES_DB: tcgplayer_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcgplayer_automation"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  app-logs:
