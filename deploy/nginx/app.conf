# Production entry point. The release script writes active/active.conf to name
# the slot that receives traffic (its Corten web container), then reloads nginx;
# a reload lets requests already in flight finish on the old slot.
resolver 127.0.0.11 valid=5s ipv6=off;

# The combined format plus how long each request took (rt, seconds) and how long
# the app took to answer (urt), so a slow or stalled request can be found in the log.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time slot=$app_color';

server {
  listen 80;
  access_log /var/log/nginx/access.log timed;

  # Sets $app_upstream (host:port) and $app_color (blue or green).
  include /etc/nginx/active/active.conf;

  # The app accepts CSV uploads of several MB.
  client_max_body_size 50m;

  location = /proxy-health {
    default_type text/plain;
    return 200 "$app_color\n";
  }

  location / {
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The app builds its own origin from Host for form-action checks, so it
    # must see the Host the browser sent, exactly as when it owned the port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Batch pricing streams server-sent events; deliver them as they arrive.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-App-Color $app_color always;
  }
}