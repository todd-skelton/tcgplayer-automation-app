# Production entry point. The release script writes active/active.conf to name
# the slot that receives traffic (its Corten web container, which relays what it
# has not ported to the slot's Node app), then reloads nginx; a reload lets
# requests already in flight finish on the old slot.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;

  # Sets $app_upstream (host:port) and $app_color (blue or green).
  include /etc/nginx/active/active.conf;

  # The app accepts CSV uploads of several MB.
  client_max_body_size 50m;

  location = /proxy-health {
    default_type text/plain;
    return 200 "$app_color\n";
  }

  location / {
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The app builds its own origin from Host for form-action checks, so it
    # must see the Host the browser sent, exactly as when it owned the port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Batch pricing streams server-sent events; deliver them as they arrive.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-App-Color $app_color always;
  }
}